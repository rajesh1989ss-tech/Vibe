<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe</title>
<meta name="theme-color" content="#060A19">
<meta name="description" content="Vibe — everything Rajesh wants to do, in one place.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='.55' stop-color='%2322D3EE'/%3E%3Cstop offset='1' stop-color='%23F472B6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23060A19'/%3E%3Cpath d='M14 20l18 26 18-26' fill='none' stroke='url(%23g)' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.16,1,.3,1);--r:22px;
--fd:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
--fb:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
--a1:#8B5CF6;--a2:#22D3EE;--a3:#F472B6;--grad:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
[data-theme=dark]{--bg:#060A19;--bg2:#0C1430;--ink:#EEF2FF;--ink2:#C3CCEA;--muted:#8693BA;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);--solid:rgba(13,20,46,.86);
--line:rgba(255,255,255,.11);--hi:rgba(255,255,255,.13);--shadow:0 22px 50px -22px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.28);
--blobA:#5B3DF5;--blobB:#0891B2;--blobC:#BE2D84;--blobOp:.40;--danger:#FF6B7D;--warn:#FFB547;--ok:#4ADE9B;color-scheme:dark}
[data-theme=light]{--bg:#EDF0FA;--bg2:#E1E7F7;--ink:#0C1330;--ink2:#2E395E;--muted:#5F6A8C;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--solid:rgba(250,251,255,.9);
--line:rgba(20,30,80,.10);--hi:rgba(255,255,255,.95);--shadow:0 20px 40px -22px rgba(30,40,110,.35),0 2px 6px rgba(30,40,100,.07);
--blobA:#A78BFA;--blobB:#67E8F9;--blobC:#F9A8D4;--blobOp:.55;--danger:#DC2F48;--warn:#C27A00;--ok:#0E9A60;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow-x:hidden;transition:background-color .6s var(--ease-out),color .4s;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:var(--fd);letter-spacing:-.02em;margin:0;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.ic{flex:none;display:block}
/* ---------- ambient ---------- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;opacity:var(--blobOp);will-change:transform}
.b1{background:radial-gradient(circle,var(--blobA),transparent 62%);top:-28vmax;left:-18vmax;animation:d1 26s ease-in-out infinite alternate}
.b2{background:radial-gradient(circle,var(--blobB),transparent 62%);top:18vh;right:-30vmax;animation:d2 33s ease-in-out infinite alternate}
.b3{background:radial-gradient(circle,var(--blobC),transparent 62%);bottom:-34vmax;left:6vw;animation:d3 40s ease-in-out infinite alternate;opacity:calc(var(--blobOp)*.75)}
@keyframes d1{to{transform:translate3d(16vw,12vh,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(-14vw,-8vh,0) scale(.9)}}
@keyframes d3{to{transform:translate3d(12vw,-10vh,0) scale(1.1)}}
.horizon{position:absolute;left:0;right:0;bottom:0;height:150px;opacity:.55}
.horizon svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.w1{animation:wave 22s linear infinite}.w2{animation:wave 34s linear infinite reverse;opacity:.6}
@keyframes wave{to{transform:translateX(-50%)}}
.shimmerline{position:absolute;left:0;right:0;bottom:118px;height:1px;background:linear-gradient(90deg,transparent,var(--a2),transparent);opacity:.25;animation:hz 9s ease-in-out infinite}
@keyframes hz{50%{opacity:.5;transform:scaleX(.7)}}
/* ---------- layout ---------- */
.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:calc(var(--st) + 12px) 16px calc(118px + var(--sb))}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#141C3F,#070B1C);border:1px solid var(--line);box-shadow:0 8px 24px -8px rgba(139,92,246,.7),inset 0 1px 0 rgba(255,255,255,.15)}
.word{font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:gradshift 8s ease-in-out infinite}
@keyframes gradshift{50%{background-position:100% 0}}
.top-act{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);transition:transform .35s var(--ease),background .3s}
.iconbtn:active{transform:scale(.9)}
/* ---------- surfaces ---------- */
.glass{position:relative;background:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.07),transparent 45%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);overflow:hidden}
.sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 7s var(--ease-out) infinite;pointer-events:none}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.st{animation:rise .7s var(--ease-out) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
.view{animation:viewin .5s var(--ease-out) both}
@keyframes viewin{from{opacity:0;transform:translateY(10px) scale(.99)}}
.sec{margin:22px 0 10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-h h2{font-size:17px}
.sec-h .sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
/* ---------- buttons/chips ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--glass2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);transition:transform .35s var(--ease),box-shadow .3s}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 10px 28px -10px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 5s var(--ease-out) infinite}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--danger)}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s var(--ease-out) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);transition:transform .3s var(--ease),background .3s,color .3s,box-shadow .3s;white-space:nowrap}
.chip:active{transform:scale(.93)}
.chip.on{background:color-mix(in srgb,var(--c,var(--a1)) 22%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--c,var(--a1)) 55%,transparent);box-shadow:0 0 18px -6px var(--c,var(--a1))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
/* ---------- hero ---------- */
.hero{padding:20px 18px 18px}
.hero-top{display:flex;justify-content:space-between;gap:14px}
.greet{font-size:26px;line-height:1.15;margin:6px 0 6px}
.line{margin:0;color:var(--ink2);font-size:14px}
.lvl{position:relative;width:86px;height:86px;flex:none}
.lvl .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.lvl b{font-family:var(--fd);font-size:26px;line-height:1;display:block}
.lvl small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)}
.ring .val{stroke-dasharray:100 100;stroke-dashoffset:100;transition:stroke-dashoffset 1.4s var(--ease-out)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:13px;font-weight:600}
.flame{color:#FF9F43;filter:drop-shadow(0 0 6px rgba(255,140,40,.7));animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.flame.out{color:var(--muted);filter:none;animation:none}
@keyframes flick{25%{transform:scale(1.08,.95) rotate(-3deg)}50%{transform:scale(.95,1.07)}75%{transform:scale(1.05,.97) rotate(3deg)}}
.meter{margin-top:16px}
.meter-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px;letter-spacing:.04em}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;border-radius:99px;background:var(--grad);transform-origin:left;transform:scaleX(0);transition:transform 1.3s var(--ease-out);box-shadow:0 0 16px rgba(34,211,238,.6)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:barsh 2.6s linear infinite;transform:translateX(-100%)}
@keyframes barsh{to{transform:translateX(100%)}}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px;text-align:left;transition:transform .4s var(--ease);transform-style:preserve-3d}
.stat:active{transform:scale(.96)}
.stat .n{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.05;display:block}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:3px}
.stat .glow{position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.45}
/* ---------- task ---------- */
.task{position:relative;border-radius:18px;margin-bottom:10px;touch-action:pan-y}
.task-in{position:relative;z-index:1;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 13px 16px;border-radius:18px;background:var(--solid);background-image:linear-gradient(180deg,rgba(255,255,255,.06),transparent 50%),linear-gradient(90deg,color-mix(in srgb,var(--c) 12%,transparent),transparent 40%);border:1px solid var(--line);box-shadow:0 12px 30px -18px rgba(0,0,0,.6),inset 0 1px 0 var(--hi);transition:transform .4s var(--ease),box-shadow .3s}
.task-in::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 12px var(--c)}
@media(hover:hover){.task-in:hover{transform:translateY(-2px);box-shadow:0 18px 36px -18px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 var(--hi)}}
.task.swiping .task-in{transition:none}
.swipe-bg{position:absolute;inset:0;border-radius:18px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s}
.task.swiping .swipe-bg{opacity:1}
.swipe-bg span{display:flex;align-items:center;gap:6px;opacity:.5;transition:opacity .2s,transform .3s var(--ease)}
.sb-l{color:var(--ok)}.sb-r{color:var(--a1)}
.task.arm-l .swipe-bg{background:color-mix(in srgb,var(--ok) 20%,transparent)}.task.arm-l .sb-l{opacity:1;transform:scale(1.12)}
.task.arm-r .swipe-bg{background:color-mix(in srgb,var(--a1) 20%,transparent)}.task.arm-r .sb-r{opacity:1;transform:scale(1.12)}
.check{position:relative;width:28px;height:28px;margin-top:-1px;border-radius:50%;flex:none;border:2px solid color-mix(in srgb,var(--c) 75%,var(--ink) 10%);display:grid;place-items:center;transition:transform .4s var(--ease),background .3s,border-color .3s;background:transparent}
.check:active{transform:scale(.82)}
.check svg{width:16px;height:16px}
.check path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .12s var(--ease-out)}
.task.completing .check,.task.done .check{background:var(--c);border-color:var(--c);transform:scale(1.12);box-shadow:0 0 18px var(--c)}
.task.completing .check path,.task.done .check path{stroke-dashoffset:0}
.tb{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;font-size:15px;line-height:1.35;display:inline;background:linear-gradient(currentColor,currentColor) 0 58%/0 2px no-repeat;transition:background-size .5s var(--ease-out),opacity .4s,color .4s}
.task.completing .ttl,.task.done .ttl{background-size:100% 2px;opacity:.55}
.nts{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--glass2);color:var(--ink2);border:1px solid var(--line)}
.mc.cat{color:var(--ink);background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.mc.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.mc.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.mc.high{color:#fff;background:linear-gradient(120deg,#F43F5E,#F97316);border:0}
.mc.medium{color:#fff;background:linear-gradient(120deg,#A855F7,#6366F1);border:0}
.mc.low{color:var(--ink2)}
.mc.qw{color:#FACC15}
.task.overdue .task-in::after,.task.today .task-in::after{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;border:1px solid var(--danger);box-shadow:0 0 22px -4px var(--danger);opacity:0;animation:pulse 2.6s ease-in-out infinite}
.task.today .task-in::after{border-color:var(--warn);box-shadow:0 0 22px -4px var(--warn)}
@keyframes pulse{50%{opacity:.85}}
.sortrow{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}
.sortrow .chip{height:30px;font-size:12px;padding:0 10px}
.collapse{overflow:hidden;transition:height .45s var(--ease-out),margin .45s var(--ease-out),opacity .35s,transform .45s var(--ease-out)}
/* ---------- groups ---------- */
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.grp-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);box-shadow:0 0 18px -8px var(--c)}
.grp-h h3{font-size:15px;flex:1}
.mini{width:30px;height:30px}
/* ---------- empty ---------- */
.empty{text-align:center;padding:34px 20px}
.empty .big{font-size:44px;line-height:1;margin-bottom:10px;display:inline-block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.empty h3{font-size:18px;margin-bottom:6px}
/* ---------- nav ---------- */
.nav{position:fixed;left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);z-index:20;width:min(560px,calc(100% - 20px));height:68px;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--solid);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);box-shadow:0 20px 50px -14px rgba(0,0,0,.6),inset 0 1px 0 var(--hi)}
.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);transition:color .3s,transform .35s var(--ease)}
.nav button:active{transform:scale(.88)}
.nav button.on{color:var(--ink)}
.nav button.on .ic{filter:drop-shadow(0 0 8px var(--a2))}
.nav .ind{position:absolute;top:8px;bottom:8px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:var(--glass2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 0 24px -8px var(--a1);transition:transform .55s var(--ease)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 12px rgba(244,114,182,.7)}
.fab{position:fixed;right:max(18px,calc(50% - 372px));bottom:calc(92px + var(--sb));z-index:21;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 16px 36px -10px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.4);overflow:hidden;transition:transform .45s var(--ease)}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.5s var(--ease-out) infinite}
/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(3,6,18,.55);animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--sb));background:var(--bg2);background-image:linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%);border:1px solid var(--line);border-bottom:0;box-shadow:0 -30px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 var(--hi);animation:up .5s var(--ease-out) both;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line);animation:pop .45s var(--ease) both;padding-bottom:22px}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}}
.sheet-wrap.out .scrim{animation:fade .25s reverse both}
.sheet-wrap.out .sheet{animation:down .3s ease-in both}
@keyframes down{to{transform:translateY(105%);opacity:.6}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 12px}
.sheet h2{font-size:20px;margin-bottom:14px}
.fld{margin-bottom:14px}
.fld>label:not(.tog),.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.inp{width:100%;min-height:46px;padding:11px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s;font-size:15px}

  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),st=t0+i*.075;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(gain,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+dur);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+dur+.03)})}catch(e){}}

function taskCard(t,o={}){const c=catOf(t),due=dueOf(t),n=due?diffDays(due,today()):null,cls=['task'];
  if(t.status==='done')cls.push('done');else if(n!==null&&n<0)cls.push('overdue');else if(n===0)cls.push('today');
  const m=[];

  if(t.status==='done')m.push(`<span class="mc">${svg('check',12)}${fmtD(t.completedDate)}</span>`);
  else if(due)m.push(`<span class="mc ${n<0?'bad':n===0?'warn':''}">${svg(t.recurring?'repeat':'calendar',12)}${dueLabel(due)}</span>`);
  if(t.recurring&&t.status!=='done')m.push(`<span class="mc">${svg('repeat',12)}${FREQ[t.recurring.frequency]||'Repeats'}</span>`);
  if(t.priority)m.push(`<span class="mc ${t.priority}">${PRI[t.priority]}</span>`);
  if(isWaiting(t)){const w=t.waitingOn||{};m.push(`<span class="mc">${svg('hourglass',12)}${esc(w.who||'Someone')}${w.since?' · '+Math.max(0,diffDays(today(),w.since))+'d':''}</span>`)}

  return `<div class="${cls.join(' ')} st" data-id="${esc(t.id)}" style="--c:${c.color};--i:${o.i||0}">
<div class="swipe-bg"><span class="sb-l">${svg('check',18)}Done</span><span class="sb-r">Options${svg('edit',18)}</span></div>

<div class="tb" data-act="edit"><div class="ttl">${esc(t.title)}</div>${t.notes&&o.notes!==false?`<div class="nts">${esc(t.notes)}</div>`:''}<div class="meta">${m.join('')}</div>${sort}</div></div></div>`}
const emptyCard=(big,h,p,i=0)=>`<div class="glass empty st" style="--i:${i}"><div class="big">${big}</div><h3>${h}</h3><div class="muted">${p}</div></div>`;
function smartCmp(a,b){const da=dueOf(a),db=dueOf(b);if(da&&db&&da!==db)return da<db?-1:1;if(da&&!db)return-1;if(!da&&db)return 1;
  const pa=PRANK[a.priority]||0,pb=PRANK[b.priority]||0;if(pa!==pb)return pb-pa;return a.createdDate<b.createdDate?-1:a.createdDate>b.createdDate?1:a.id.localeCompare(b.id,undefined,{numeric:true})}
function todaysThree(){const td=today();
  const sc=t=>{let s=0;const d=dueOf(t);if(d){const n=diffDays(d,td);s+=n<0?1000-n:n===0?800:n<=3?600-n*40:n<=7?300:0}s+=t.priority==='high'?320:t.priority==='medium'?150:t.priority==='low'?40:0;return s};
  const pool=S.tasks.filter(t=>isOpen(t)&&!isWaiting(t)&&!isInbox(t)).map(t=>[sc(t),t]);
  pool.sort((a,b)=>b[0]-a[0]||smartCmp(a[1],b[1]));return pool.slice(0,3).map(x=>x[1])}
